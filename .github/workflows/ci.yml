name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node tests/run.js

  # Separate job on purpose: a Playwright browser download/install is
  # several hundred MB and strictly slower than the jsdom job above, so it
  # must never be able to slow down or block that fast unit-test signal.
  # Runs chromium, firefox, AND webkit (see playwright.config.js) — this
  # is the job that can retire the app's own published open question
  # about whether the programmatic-focus indicator renders outside
  # Chromium (see src/views/accessibility.js, route #/accessibility).
  e2e:
    name: e2e (Playwright — chromium, firefox, webkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
