name: Accessibility issue
description: Something doesn't work with keyboard, screen reader, contrast, or other a11y tooling.
title: "[a11y] "
labels: ["accessibility", "bug"]
body:
  - type: textarea
    attributes:
      label: What happens
      description: Describe the issue.
      placeholder: "Tabbing into the radiogroup focuses the first option, but arrow keys don't move between options on Firefox 121."
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Assistive tech / context
      multiple: true
      options:
        - VoiceOver (macOS)
        - VoiceOver (iOS)
        - NVDA
        - JAWS
        - TalkBack (Android)
        - Keyboard only (no AT)
        - Reduced motion
        - High contrast / dark mode
        - Zoom 200%+
    validations:
      required: true
  - type: input
    attributes:
      label: Browser
      placeholder: "Firefox 121 on macOS 14"
    validations:
      required: false
  - type: textarea
    attributes:
      label: WCAG criterion (if known)
      placeholder: "SC 2.1.1 Keyboard"
    validations:
      required: false
